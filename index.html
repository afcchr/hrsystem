<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art Fresh Chicken Corp. — Human Resource Management System</title>

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="top-accent-bar"></div>

<!-- Public applicant portal mounts here (replaces the admin shell on /apply routes) -->
<div id="portalRoot" class="hidden"></div>

<div id="authScreen" class="auth-screen hidden">
  <form id="authForm" class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:18px">
      <div class="brand-mark">AF</div>
      <div>
        <div class="brand-name">Art Fresh Chicken</div>
        <div class="brand-sub">Human Resources</div>
      </div>
    </div>
    <h2>Sign in</h2>
    <label>Email<input type="email" id="authEmail" autocomplete="username" required /></label>
    <label>Password<input type="password" id="authPassword" autocomplete="current-password" required /></label>
    <div id="authError" class="auth-error hidden"></div>
    <button type="submit" class="btn primary" id="authSubmit">Sign in</button>
    <div class="auth-hint">Accounts are created by the HR system administrator. Contact them for access.</div>
  </form>
</div>

<div id="bootLoading" class="boot-loading">
  <div class="boot-spinner"></div>
  <div>Loading HR data…</div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">AF</div>
      <div>
        <div class="brand-name">Art Fresh Chicken</div>
        <div class="brand-sub">Human Resources</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="sidebar-foot">
      <button class="user-chip" id="userBtn">
        <span class="avatar" style="background:#3f5a4c">MR</span>
        <span class="user-meta"><b>Maria Reyes</b><span id="roleLabel">HR Manager</span></span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open menu"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-spacer"></div>
      <div class="live-clock" id="liveClock" title="Live · system is active">
        <span class="dot pulse live-clock-dot"></span>
        <span class="live-clock-date" id="liveClockDate"></span>
        <span class="live-clock-time" id="liveClockTime"></span>
      </div>
      <button class="search-trigger" id="searchTrigger" aria-label="Search">
        <span class="ico" data-ico="search"></span>
        <span>Search people, applications…</span>
        <span class="kbd">⌘K</span>
      </button>
      <button class="icon-btn" id="quickBtn" title="Quick actions" aria-label="Quick actions"></button>
      <button class="icon-btn bordered" id="themeToggle" title="Switch appearance" aria-label="Switch appearance"></button>
      <button class="icon-btn" id="notifBtn" title="Notifications" aria-label="Notifications"></button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail panel"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="palette" id="palette" role="dialog" aria-label="Global search"></div>
<div class="pop" id="pop"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="qr.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
